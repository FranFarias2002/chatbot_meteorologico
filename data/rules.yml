version: "3.1"

rules:

- rule: Responder siempre al chitchat
  steps:
    - intent: chitchat
    - action: action_handle_chitchat

- rule: Responder al saludo
  steps:
    - intent: greet
    - action: utter_greet

- rule: Ejecutar clima siempre que se pida
  steps:
    - intent: consultar_clima
    - action: action_get_weather

- rule: Redirección manual a soporte
  steps:
    - intent: pedir_soporte
    - action: utter_soporte